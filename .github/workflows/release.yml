name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            # Obsidian downloads the release whose tag equals manifest.json's version,
            # so refuse to release a tag that doesn't match.
            - name: Check tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version=$(node -p "require('./manifest.json').version")
                  if [ "$tag" != "$version" ]; then
                    echo "::error::Tag $tag does not match manifest.json version $version"
                    exit 1
                  fi
                  node -e "const v=require('./versions.json'); if(!v['$version']){console.error('versions.json has no entry for $version'); process.exit(1)}"

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    --generate-notes \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
