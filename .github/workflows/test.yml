name: Test

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['**']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    unit:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'npm'
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            # Pillow independently checks the PNGs the unit tests write.
            - run: pip install pillow
            - run: npm ci
            - run: npm run test:unit

    ui:
        name: UI tests (Obsidian)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'npm'
            - run: npm ci

            # wdio.conf.mts prints the Obsidian versions it will test; use them as the cache key.
            - name: Get Obsidian cache key
              run: |
                  npx tsx wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
                  rm -rf .obsidian-cache
              env:
                  CI: 'true'

            - name: Cache Obsidian
              uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}

            # Obsidian needs a display: run a virtual one with a window manager.
            - name: Set up virtual display
              run: |
                  sudo apt-get update -q
                  sudo apt-get install -q -y herbstluftwm
                  export DISPLAY=:99
                  echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
                  Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
                  sleep 1
                  herbstluftwm &
                  sleep 1

            - name: Run UI tests
              run: npm run test:e2e
              env:
                  WDIO_MAX_INSTANCES: 2
