name: Feature request
description: Suggest an idea for the plugin
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What would you like to do?
          description: Describe what you're trying to do and why the plugin doesn't help today.
      validations:
          required: true
    - type: textarea
      id: idea
      attributes:
          label: How could it work?
