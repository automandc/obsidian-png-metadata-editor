name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: What you did, what you expected, and what happened instead.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Open a PNG that ...
              2. Select ...
    - type: input
      id: plugin-version
      attributes:
          label: Plugin version
          description: Shown in Settings → Community plugins.
      validations:
          required: true
    - type: input
      id: obsidian-version
      attributes:
          label: Obsidian version and platform
          placeholder: 1.9.10 on macOS
      validations:
          required: true
    - type: textarea
      id: files
      attributes:
          label: Example file
          description: If you can, attach a PNG that shows the problem (zip it so GitHub keeps the metadata). Don't share files with private information.
